<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Painter</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a18;
    --text2: #666660;
    --text3: #999993;
    --info-bg: #e6f1fb;
    --info-text: #0c447c;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1c1c1a;
      --surface2: #242422;
      --border: rgba(255,255,255,0.1);
      --text: #f0efe9;
      --text2: #999993;
      --text3: #5f5e5a;
      --info-bg: #0c447c;
      --info-text: #b5d4f4;
    }
    #draw-canvas { background: #1a1a18 !important; }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 0;
  }

  h1 { font-size: 18px; font-weight: 500; margin-bottom: 16px; }

  #canvas-wrap {
    position: relative;
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    width: 100%;
    max-width: 800px;
  }

  #draw-canvas { display: block; width: 100%; background: #fafaf8; }

  #overlay-canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  #params {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
    width: 100%;
    max-width: 800px;
  }
  @media (max-width: 500px) { #params { grid-template-columns: repeat(2, 1fr); } }

  .param-card {
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border);
    padding: 10px 12px;
  }
  .param-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; letter-spacing: 0.02em; }
  .param-row { display: flex; align-items: center; gap: 7px; }
  .param-val { font-size: 17px; font-weight: 500; color: var(--text); line-height: 1; }
  .param-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
  #color-swatch {
    width: 18px; height: 18px; border-radius: 50%;
    border: 0.5px solid var(--border); flex-shrink: 0;
    background: #aaa; transition: background 0.1s;
  }

  #controls, #tool-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
    align-items: center;
    width: 100%;
    max-width: 800px;
  }
  #tool-row { gap: 6px; }

  .tool-label { font-size: 11px; color: var(--text3); padding: 0 2px; }

  button {
    padding: 7px 16px;
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s;
  }
  button:hover { background: var(--surface2); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: transparent; }

  #toggleBtn {
    background: var(--info-bg); color: var(--info-text);
    border-color: transparent; font-weight: 500;
  }
  #toggleBtn.active {
    background: var(--surface2); color: var(--text);
    border-color: var(--border); font-weight: 400;
  }

  .brush-btn { padding: 5px 11px; font-size: 12px; }
  .brush-btn.active {
    background: var(--info-bg); color: var(--info-text);
    border-color: transparent; font-weight: 500;
  }

  #mic-status {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text2); margin-left: auto;
  }
  #mic-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text3); flex-shrink: 0;
  }
  #mic-dot.on { background: #4CAF50; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  #volume-wrap { flex: 1; min-width: 60px; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  #volume-bar { height: 5px; width: 0%; background: #5DCAA5; border-radius: 3px; transition: width 0.04s, background 0.1s; }

  #collab-panel {
    display: none;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
    width: 100%;
    max-width: 800px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
  }
  #collab-panel.open { display: flex; }
  .collab-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); flex-wrap: wrap; }
  #my-peer-id {
    font-family: 'Courier New', monospace; font-size: 11px;
    background: var(--surface2); padding: 2px 7px; border-radius: 4px; user-select: all;
  }
  #remote-id-input {
    flex: 1; min-width: 120px; padding: 5px 8px;
    border: 0.5px solid var(--border); border-radius: 4px;
    background: var(--surface2); color: var(--text);
    font-size: 12px; font-family: 'Courier New', monospace; outline: none;
  }
  #conn-status { font-size: 11px; color: var(--text3); }

  #legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-top: 10px; width: 100%; max-width: 800px;
  }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  #hint { font-size: 12px; color: var(--text3); margin-top: 10px; width: 100%; max-width: 800px; line-height: 1.6; }
</style>
</head>
<body>

<h1>Voice Painter</h1>

<div id="canvas-wrap">
  <canvas id="draw-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>
</div>

<div id="params">
  <div class="param-card">
    <div class="param-label">色相 — 音程</div>
    <div class="param-row">
      <div id="color-swatch"></div>
      <div class="param-val" id="p-pitch">—</div>
    </div>
    <div class="param-sub" id="p-pitch-name">低音=赤 / 高音=紫</div>
  </div>
  <div class="param-card">
    <div class="param-label">方向 — 音程×音色</div>
    <div class="param-val" id="p-dir">—°</div>
    <div class="param-sub" id="p-dir-name">高音=上 / 低音=下 / 音色=左右</div>
  </div>
  <div class="param-card">
    <div class="param-label">太さ — 音量</div>
    <div class="param-val" id="p-thick">—px</div>
    <div class="param-sub">大声=太い / 小声=細い</div>
  </div>
  <div class="param-card">
    <div class="param-label">長さ — 持続時間</div>
    <div class="param-val" id="p-len">—</div>
    <div class="param-sub">長く出す=長い線</div>
  </div>
</div>

<div id="controls">
  <button id="toggleBtn">マイクをオン</button>
  <button id="clearBtn">クリア</button>
  <button id="undoBtn">もどす</button>
  <div id="volume-wrap"><div id="volume-bar"></div></div>
  <div id="mic-status"><div id="mic-dot"></div><span id="status-txt">停止中</span></div>
</div>

<div id="tool-row">
  <span class="tool-label">ブラシ</span>
  <button class="brush-btn active" data-mode="line">線</button>
  <button class="brush-btn" data-mode="glow">グロー</button>
  <button class="brush-btn" data-mode="splatter">飛沫</button>
  <button class="brush-btn" data-mode="ribbon">リボン</button>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button id="saveBtn">PNG保存</button>
    <button id="collabBtn">共演</button>
  </div>
</div>

<div id="collab-panel">
  <div class="collab-row">
    <button id="copyLinkBtn" style="padding:5px 14px;font-size:12px">リンクをコピー</button>
    <div id="conn-status">— リンクを相手に送ってください</div>
  </div>
  <div class="collab-row" style="font-size:11px;color:var(--text3);flex-wrap:wrap;gap:6px">
    ID直接入力：
    <input id="remote-id-input" placeholder="相手のIDを貼り付け" style="font-size:11px;padding:3px 7px">
    <button id="connectBtn" style="padding:3px 10px;font-size:11px">接続</button>
    <code id="my-peer-id" style="margin-left:auto"></code>
  </div>
</div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#E24B4A;"></div>低音（赤）</div>
  <div class="leg"><div class="leg-dot" style="background:#EF9F27;"></div>中低音（橙）</div>
  <div class="leg"><div class="leg-dot" style="background:#639922;"></div>中音（緑）</div>
  <div class="leg"><div class="leg-dot" style="background:#378ADD;"></div>中高音（青）</div>
  <div class="leg"><div class="leg-dot" style="background:#7F77DD;"></div>高音（紫）</div>
</div>

<div id="hint">
  スペクトルを円にマッピングし、エネルギー重心の向きに進みます。純音=一定方向 / ノイズ=ランダム
</div>

<script>
const drawCanvas = document.getElementById('draw-canvas');
const overlayCanvas = document.getElementById('overlay-canvas');
const dc = drawCanvas.getContext('2d');
const oc = overlayCanvas.getContext('2d');

const toggleBtn  = document.getElementById('toggleBtn');
const clearBtn   = document.getElementById('clearBtn');
const undoBtn    = document.getElementById('undoBtn');
const saveBtn    = document.getElementById('saveBtn');
const collabBtn  = document.getElementById('collabBtn');
const micDot     = document.getElementById('mic-dot');
const statusTxt  = document.getElementById('status-txt');
const colorSwatch= document.getElementById('color-swatch');
const pPitch     = document.getElementById('p-pitch');
const pPitchName = document.getElementById('p-pitch-name');
const pDir       = document.getElementById('p-dir');
const pDirName   = document.getElementById('p-dir-name');
const pThick     = document.getElementById('p-thick');
const pLen       = document.getElementById('p-len');
const volumeBar  = document.getElementById('volume-bar');

let W, H;

function bgColor() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? '#1a1a18' : '#fafaf8';
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  H = Math.round(W * 0.56);
  drawCanvas.width = W; drawCanvas.height = H;
  overlayCanvas.width = W; overlayCanvas.height = H;
  dc.fillStyle = bgColor(); dc.fillRect(0, 0, W, H);
}
resize();
window.addEventListener('resize', () => { resize(); snapshots = [drawCanvas.toDataURL()]; });

let audioCtx, analyser, running = false;
let dataTime, dataFreq;
let snapshots = [drawCanvas.toDataURL()];

function saveSnapshot() {
  snapshots.push(drawCanvas.toDataURL());
  if (snapshots.length > 40) snapshots.shift();
}

// ── Brush mode ──────────────────────────────────────────────
let brushMode = 'line';
document.querySelectorAll('.brush-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    brushMode = btn.dataset.mode;
  });
});

// ── PNG Save ─────────────────────────────────────────────────
saveBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'voice-painting-' + new Date().toISOString().slice(0, 10) + '.png';
  link.href = drawCanvas.toDataURL('image/png');
  link.click();
});

// ── Render stroke (shared by local / replay / remote) ────────
function renderStroke(points, bm) {
  if (!points || points.length < 2) return;
  dc.save();
  dc.lineCap = 'round'; dc.lineJoin = 'round';
  if (bm === 'line') {
    for (let i = 1; i < points.length; i++) {
      const a = points[i-1], b = points[i];
      dc.beginPath(); dc.moveTo(a.x, a.y); dc.lineTo(b.x, b.y);
      dc.strokeStyle = b.color; dc.lineWidth = b.thickness; dc.stroke();
    }
  } else if (bm === 'glow') {
    const layers = [
      { mult: 7,   alpha: 0.03 },
      { mult: 3.5, alpha: 0.07 },
      { mult: 2,   alpha: 0.15 },
      { mult: 1,   alpha: 0.9  },
    ];
    for (let i = 1; i < points.length; i++) {
      const a = points[i-1], b = points[i];
      for (const { mult, alpha } of layers) {
        dc.beginPath(); dc.moveTo(a.x, a.y); dc.lineTo(b.x, b.y);
        dc.strokeStyle = withAlpha(b.color, alpha);
        dc.lineWidth = b.thickness * mult;
        dc.stroke();
      }
    }
  } else if (bm === 'ribbon') {
    for (let i = 1; i < points.length; i++) {
      const a = points[i-1], b = points[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const nx = -dy/len, ny = dx/len;
      const hw = Math.max(2, b.thickness * 0.8);
      const grad = dc.createLinearGradient(
        b.x + nx*hw, b.y + ny*hw, b.x - nx*hw, b.y - ny*hw
      );
      grad.addColorStop(0,    withAlpha(b.color, 0.15));
      grad.addColorStop(0.25, withAlpha(b.color, 0.85));
      grad.addColorStop(0.5,  withAlpha(b.color, 1.0));
      grad.addColorStop(0.75, withAlpha(b.color, 0.85));
      grad.addColorStop(1,    withAlpha(b.color, 0.15));
      dc.beginPath();
      dc.moveTo(a.x + nx*hw, a.y + ny*hw);
      dc.lineTo(b.x + nx*hw, b.y + ny*hw);
      dc.lineTo(b.x - nx*hw, b.y - ny*hw);
      dc.lineTo(a.x - nx*hw, a.y - ny*hw);
      dc.closePath();
      dc.fillStyle = grad;
      dc.fill();
    }
  } else if (bm === 'splatter') {
    for (const p of points) {
      const n = Math.round((p.thickness / 30) * 14) + 2;
      for (let k = 0; k < n; k++) {
        const r = Math.random() * p.thickness * 2.5;
        const a = Math.random() * Math.PI * 2;
        const sr = Math.random() * p.thickness * 0.35 + 0.5;
        dc.beginPath(); dc.arc(p.x + Math.cos(a)*r, p.y + Math.sin(a)*r, sr, 0, Math.PI*2);
        dc.fillStyle = p.color; dc.fill();
      }
    }
  } else if (bm === 'calligraphy') {
    for (let i = 1; i < points.length; i++) {
      const a = points[i-1], b = points[i];
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      dc.save(); dc.translate(b.x, b.y); dc.rotate(angle);
      dc.beginPath();
      dc.ellipse(0, 0, Math.max(1, b.thickness * 0.65), Math.max(0.5, b.thickness * 0.14 + 0.5), 0, 0, Math.PI * 2);
      dc.fillStyle = b.color; dc.fill(); dc.restore();
    }
  }
  dc.restore();
}

// ── WebRTC collaboration (PeerJS) ────────────────────────────
let peer = null, conn = null, remoteStroke = [];
const connStatus  = document.getElementById('conn-status');
const myPeerIdEl  = document.getElementById('my-peer-id');

function sendRemote(data) {
  if (conn && conn.open) conn.send(data);
}

function handleRemoteData(data) {
  if (data.type === 'point') {
    if (data.bm === 'splatter') {
      renderStroke([data.p], 'splatter');
    } else {
      remoteStroke.push(data.p);
      if (remoteStroke.length > 1) {
        renderStroke(remoteStroke.slice(-2), data.bm);
      }
    }
  } else if (data.type === 'commit') {
    if (data.bm !== 'splatter') renderStroke(data.points, data.bm);
    saveSnapshot(); remoteStroke = [];
  } else if (data.type === 'clear') {
    dc.fillStyle = bgColor(); dc.fillRect(0, 0, W, H);
  }
}

function setupConn(c) {
  conn = c;
  conn.on('open', () => {
    connStatus.textContent = '接続済み ✓';
    connStatus.style.color = '#4CAF50';
  });
  conn.on('data', handleRemoteData);
  conn.on('close', () => { connStatus.textContent = '切断されました'; connStatus.style.color = ''; conn = null; });
  conn.on('error', () => { connStatus.textContent = '接続エラー'; conn = null; });
}

function initPeer() {
  if (peer) return;
  peer = new Peer();
  peer.on('open', id => {
    myPeerIdEl.textContent = id;
    const target = location.hash.slice(1);
    if (target && target !== id) {
      connStatus.textContent = '接続中...';
      setupConn(peer.connect(target, { reliable: true }));
    } else {
      connStatus.textContent = '— リンクを相手に送ってください';
    }
  });
  peer.on('connection', c => setupConn(c));
  peer.on('error', e => { connStatus.textContent = 'PeerJSエラー: ' + e.type; });
}

collabBtn.addEventListener('click', () => {
  const panel = document.getElementById('collab-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) initPeer();
});
document.getElementById('copyLinkBtn').addEventListener('click', () => {
  const url = location.href.split('#')[0] + '#' + myPeerIdEl.textContent;
  navigator.clipboard.writeText(url).catch(() => {});
  const btn = document.getElementById('copyLinkBtn');
  btn.textContent = 'コピーしました！';
  setTimeout(() => { btn.textContent = 'リンクをコピー'; }, 2000);
});
document.getElementById('connectBtn').addEventListener('click', () => {
  const id = document.getElementById('remote-id-input').value.trim();
  if (!id || !peer) return;
  connStatus.textContent = '接続中...';
  setupConn(peer.connect(id, { reliable: true }));
});

if (location.hash.slice(1)) {
  document.getElementById('collab-panel').classList.add('open');
  initPeer();
}

// ── Audio ────────────────────────────────────────────────────
toggleBtn.addEventListener('click', async () => {
  if (!running) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0.6;
      const src = audioCtx.createMediaStreamSource(stream);
      src.connect(analyser);
      dataTime = new Uint8Array(analyser.fftSize);
      dataFreq = new Uint8Array(analyser.frequencyBinCount);
      running = true;
      micDot.classList.add('on');
      statusTxt.textContent = '収音中';
      toggleBtn.textContent = '停止';
      toggleBtn.classList.add('active');
      curX = W / 2; curY = H / 2;
      loop();
    } catch (e) {
      statusTxt.textContent = 'マイク許可が必要です';
    }
  } else {
    running = false;
    if (audioCtx) audioCtx.close();
    micDot.classList.remove('on');
    statusTxt.textContent = '停止中';
    toggleBtn.textContent = 'マイクをオン';
    toggleBtn.classList.remove('active');
    volumeBar.style.width = '0%';
    oc.clearRect(0, 0, W, H);
    if (currentStroke.length > 1) commitStroke();
  }
});

clearBtn.addEventListener('click', () => {
  saveSnapshot();
  dc.fillStyle = bgColor(); dc.fillRect(0, 0, W, H);
  sendRemote({ type: 'clear' });
});

undoBtn.addEventListener('click', () => {
  if (snapshots.length < 2) return;
  snapshots.pop();
  const img = new Image();
  img.onload = () => { dc.clearRect(0, 0, W, H); dc.drawImage(img, 0, 0); };
  img.src = snapshots[snapshots.length - 1];
});

function getVolume() {
  analyser.getByteTimeDomainData(dataTime);
  let sum = 0;
  for (let i = 0; i < dataTime.length; i++) sum += (dataTime[i] - 128) ** 2;
  return Math.sqrt(sum / dataTime.length) / 128;
}

function getDominantPitch() {
  analyser.getByteFrequencyData(dataFreq);
  const nyq = audioCtx.sampleRate / 2;
  let maxVal = 0, maxIdx = 4;
  const lo = Math.floor(80 / nyq * dataFreq.length);
  const hi = Math.floor(1400 / nyq * dataFreq.length);
  for (let i = lo; i < hi; i++) {
    if (dataFreq[i] > maxVal) { maxVal = dataFreq[i]; maxIdx = i; }
  }
  return { freq: maxIdx / dataFreq.length * nyq, strength: maxVal / 255 };
}

let baseVx = 0, baseVy = 0;
function getSpectrumVector(speaking) {
  analyser.getByteFrequencyData(dataFreq);
  const nyq = audioCtx.sampleRate / 2;
  const loHz = 80, hiHz = 4000;
  let vx = 0, vy = 0, total = 0;
  for (let i = 0; i < dataFreq.length; i++) {
    const hz = (i / dataFreq.length) * nyq;
    if (hz < loHz || hz > hiHz) continue;
    const t = Math.log(hz / loHz) / Math.log(hiHz / loHz);
    const angle = t * Math.PI * 2;
    const energy = dataFreq[i] / 255;
    vx += Math.cos(angle) * energy; vy += Math.sin(angle) * energy; total += energy;
  }
  if (total < 0.01) return { angle: 0, concentration: 0 };
  const nx = vx / total, ny = vy / total;
  if (speaking) { baseVx += (nx - baseVx) * 0.002; baseVy += (ny - baseVy) * 0.002; }
  const rx = nx - baseVx, ry = ny - baseVy;
  const mag = Math.sqrt(rx * rx + ry * ry);
  return { angle: Math.atan2(ry, rx), concentration: Math.min(1, mag * 5) };
}

function withAlpha(color, alpha) {
  return color.replace(/[\d.]+\)$/, alpha + ')');
}

function freqToHue(freq) {
  return Math.max(0, Math.min(1, (freq - 80) / (900 - 80))) * 270;
}
function hueToCSS(hue, alpha) { return `hsla(${Math.round(hue)},72%,50%,${alpha})`; }
function pitchName(freq) {
  if (freq < 160) return '低音域'; if (freq < 320) return '中低音域';
  if (freq < 520) return '中音域';  if (freq < 750) return '中高音域'; return '高音域';
}
function angleName(deg) {
  const dirs = ['→ 右','↗ 右上','↑ 上','↖ 左上','← 左','↙ 左下','↓ 下','↘ 右下'];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
}

let currentStroke = [], strokeActive = false;
let strokeStartTime = 0, strokeDuration = 0;
let curX = 0, curY = 0, curAngle = 0;
let curColor = '#999', curThickness = 2;
let silenceFrames = 0;
const SILENCE_THRESH = 0.012, SILENCE_TIMEOUT = 14;
let frame = 0;

curX = W / 2; curY = H / 2;

function commitStroke() {
  if (currentStroke.length < 2) { currentStroke = []; return; }
  if (brushMode !== 'splatter') renderStroke(currentStroke, brushMode);
  sendRemote({ type: 'commit', points: currentStroke, bm: brushMode });
  saveSnapshot();
  currentStroke = []; strokeActive = false; strokeDuration = 0;
}

function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  frame++;

  const vol = getVolume();
  const { freq, strength } = getDominantPitch();
  const isSpeaking = vol > SILENCE_THRESH && strength > 0.05;
  const specVec = getSpectrumVector(isSpeaking);

  const vol100 = Math.min(100, Math.round(vol * 280));
  volumeBar.style.width = vol100 + '%';
  volumeBar.style.background = vol100 > 72 ? '#D85A30' : vol100 > 42 ? '#FAC775' : '#5DCAA5';

  if (isSpeaking) {
    silenceFrames = 0;
    if (!strokeActive) {
      strokeActive = true;
      strokeStartTime = Date.now();
      curX = Math.max(30, Math.min(W - 30, curX + (Math.random() - 0.5) * 50));
      curY = Math.max(30, Math.min(H - 30, curY + (Math.random() - 0.5) * 50));
      currentStroke.push({ x: curX, y: curY, color: curColor, thickness: curThickness });
    }

    const hue = freqToHue(freq);
    curColor = hueToCSS(hue, 0.88);
    curThickness = Math.max(1.5, Math.min(30, vol * 180));
    curAngle = specVec.angle;
    strokeDuration = (Date.now() - strokeStartTime) / 1000;

    const stepLen = Math.max(2, vol * 35 + 2);
    const spread = Math.PI * (1 - specVec.concentration) * 0.2;
    curX += Math.cos(curAngle + (Math.random() - 0.5) * spread) * stepLen;
    curY += Math.sin(curAngle + (Math.random() - 0.5) * spread) * stepLen;
    curX = Math.max(6, Math.min(W - 6, curX));
    curY = Math.max(6, Math.min(H - 6, curY));

    const pt = { x: curX, y: curY, color: curColor, thickness: curThickness };

    if (brushMode === 'splatter') {
      const n = Math.round(vol * 14) + 2;
      dc.save();
      for (let k = 0; k < n; k++) {
        const r = Math.random() * curThickness * 2.5;
        const a = Math.random() * Math.PI * 2;
        const sr = Math.random() * curThickness * 0.35 + 0.5;
        dc.beginPath(); dc.arc(curX + Math.cos(a)*r, curY + Math.sin(a)*r, sr, 0, Math.PI*2);
        dc.fillStyle = curColor; dc.fill();
      }
      dc.restore();
      currentStroke.push(pt);
      sendRemote({ type: 'point', p: pt, bm: brushMode });
    } else {
      currentStroke.push(pt);
      sendRemote({ type: 'point', p: pt, bm: brushMode });
    }

    colorSwatch.style.background = curColor;
    pPitch.textContent = Math.round(freq) + ' Hz';
    pPitchName.textContent = pitchName(freq);
    const deg = Math.round(((curAngle * 180 / Math.PI) % 360 + 360) % 360);
    pDir.textContent = deg + '°';
    pDirName.textContent = angleName(deg) + '  集中度' + Math.round(specVec.concentration * 100) + '%';
    pThick.textContent = Math.round(curThickness) + ' px';
    pLen.textContent = strokeDuration.toFixed(1) + ' 秒';
  } else {
    silenceFrames++;
    if (silenceFrames === SILENCE_TIMEOUT && currentStroke.length > 1) commitStroke();
  }

  // Overlay: cursor ring + direction arrow
  oc.clearRect(0, 0, W, H);
  if (strokeActive && currentStroke.length > 0) {
    const last = currentStroke[currentStroke.length - 1];
    oc.save();
    oc.beginPath(); oc.arc(last.x, last.y, curThickness / 2 + 5, 0, Math.PI * 2);
    oc.strokeStyle = curColor; oc.lineWidth = 1.5; oc.stroke();
    oc.beginPath(); oc.moveTo(last.x, last.y);
    oc.lineTo(last.x + Math.cos(curAngle) * 28, last.y + Math.sin(curAngle) * 28);
    oc.strokeStyle = curColor; oc.lineWidth = 1; oc.setLineDash([3, 3]); oc.stroke();
    oc.setLineDash([]); oc.restore();
  }

  // Periodic flush to dc (except splatter which draws directly)
  if (frame % 30 === 0 && currentStroke.length > 1 && brushMode !== 'splatter') {
    renderStroke(currentStroke, brushMode);
    currentStroke = [currentStroke[currentStroke.length - 1]];
  }
}
</script>
</body>
</html>
