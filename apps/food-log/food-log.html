<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ごはん日記</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c2410c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ごはん日記">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.tailwindcss.com; style-src 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; worker-src 'self'; img-src 'self' blob: data: https://*.tile.openstreetmap.org; manifest-src 'self'; connect-src https://nominatim.openstreetmap.org">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .leaflet-container { z-index: 0; }
    .card-overlay { background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.18) 50%, transparent 80%); }
    input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; }
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── SVG Icons ──────────────────────────────────────────────────────────

    const Ic = ({ n, size = 20, className = '', fill = 'none', strokeWidth = 2 }) => {
      const icons = {
        utensils:     <><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 002-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 00-5 5v6c0 1.1.9 2 2 2h3"/><path d="M21 15v7"/></>,
        grid:         <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>,
        map:          <><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></>,
        plus:         <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
        search:       <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        download:     <><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        pencil:       <><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
        trash:        <><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></>,
        x:            <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
        mapPin:       <><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></>,
        extLink:      <><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></>,
        camera:       <><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></>,
        chevL:        <polyline points="15 18 9 12 15 6"/>,
        chevR:        <polyline points="9 18 15 12 9 6"/>,
        star:         <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>,
        folder:       <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>,
        info:         <><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
        alert:        <><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>,
        check:        <polyline points="20 6 9 17 4 12"/>,
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}
          stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round"
          strokeLinejoin="round" className={className}>
          {icons[n]}
        </svg>
      );
    };

    // ── Utils ──────────────────────────────────────────────────────────────

    const escapeHtml = (s) => { const d = document.createElement('div'); d.textContent = String(s||''); return d.innerHTML; };

    const compressImage = (file) => new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const MAX = 1080;
        let { width: w, height: h } = img;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; } else { w = Math.round(w * MAX / h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.78));
      };
      img.src = url;
    });

    const geocodeAddress = async (address) => {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`,
        { headers: { 'Accept-Language': 'ja,en' } }
      );
      const data = await res.json();
      if (data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      return null;
    };

    // ── Parsers ────────────────────────────────────────────────────────────

    const parseKML = (text) => {
      const doc = new DOMParser().parseFromString(text, 'text/xml');
      return Array.from(doc.querySelectorAll('Placemark')).map(p => {
        const name = p.querySelector('name')?.textContent?.trim() || '';
        const coords = p.querySelector('coordinates')?.textContent?.trim() || '';
        const [lngS, latS] = coords.split(',');
        const lat = parseFloat(latS), lng = parseFloat(lngS);
        const address = p.querySelector('address')?.textContent?.trim() ||
                        p.querySelector('description')?.textContent?.replace(/<[^>]*>/g,'').trim() || '';
        return { name, lat: isNaN(lat) ? null : lat, lng: isNaN(lng) ? null : lng, address };
      }).filter(r => r.name);
    };

    const parseCSVLine = (line) => {
      const res = []; let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        if (line[i] === '"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
        else if (line[i]===',' && !inQ) { res.push(cur); cur=''; } else cur+=line[i];
      }
      res.push(cur); return res;
    };

    const parseCSV = (text) => {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const h = parseCSVLine(lines[0]).map(x => x.toLowerCase().trim());
      const ni = h.findIndex(x => ['name','名前','店名'].includes(x));
      const di = h.findIndex(x => ['description','説明','住所'].includes(x));
      const wi = h.findIndex(x => x === 'wkt');
      const li = h.findIndex(x => ['latitude','lat','緯度'].includes(x));
      const gi = h.findIndex(x => ['longitude','lng','lon','経度'].includes(x));
      return lines.slice(1).map(line => {
        const c = parseCSVLine(line);
        const name = ni >= 0 ? c[ni]?.trim() : '';
        const address = di >= 0 ? c[di]?.trim() : '';
        let lat = null, lng = null;
        if (wi >= 0) {
          const m = (c[wi]||'').match(/POINT\s*\(\s*([+-]?\d+\.?\d*)\s+([+-]?\d+\.?\d*)\s*\)/i);
          if (m) { lng = parseFloat(m[1]); lat = parseFloat(m[2]); }
        } else if (li >= 0 && gi >= 0) { lat = parseFloat(c[li]); lng = parseFloat(c[gi]); }
        return { name, address, lat: isNaN(lat)?null:lat, lng: isNaN(lng)?null:lng };
      }).filter(r => r.name);
    };

    // ── Validation ─────────────────────────────────────────────────────────

    const validateRestaurant = (r) => {
      if (!r || typeof r !== 'object') return null;
      return {
        id: Number(r.id) || Date.now(),
        name: String(r.name || '').slice(0, 200),
        address: String(r.address || '').slice(0, 500),
        lat: typeof r.lat === 'number' && !isNaN(r.lat) ? r.lat : null,
        lng: typeof r.lng === 'number' && !isNaN(r.lng) ? r.lng : null,
        rating: Math.min(5, Math.max(1, Number(r.rating) || 3)),
        visitDate: /^\d{4}-\d{2}-\d{2}$/.test(r.visitDate) ? r.visitDate : new Date().toISOString().split('T')[0],
        photos: Array.isArray(r.photos) ? r.photos.filter(p => typeof p==='string' && p.startsWith('data:')).slice(0,10) : [],
        comment: String(r.comment || '').slice(0, 2000),
      };
    };

    // ── Star components ────────────────────────────────────────────────────

    const Stars = ({ value, onDark = false, size = 12 }) => (
      <div className="flex gap-0.5">
        {[1,2,3,4,5].map(s => (
          <Ic key={s} n="star" size={size}
            fill={s <= value ? 'currentColor' : 'none'}
            className={s <= value ? 'text-amber-400' : onDark ? 'text-white/25' : 'text-stone-200'}
            strokeWidth={s <= value ? 0 : 1.5} />
        ))}
      </div>
    );

    const StarPicker = ({ value, onChange }) => {
      const [hover, setHover] = useState(0);
      return (
        <div className="flex gap-1.5">
          {[1,2,3,4,5].map(s => (
            <button key={s} type="button"
              className="p-1 transition-transform active:scale-90"
              onMouseEnter={() => setHover(s)} onMouseLeave={() => setHover(0)}
              onClick={() => onChange(s)}>
              <Ic n="star" size={30}
                fill={s <= (hover || value) ? 'currentColor' : 'none'}
                strokeWidth={s <= (hover || value) ? 0 : 1.5}
                className={s <= (hover || value) ? 'text-amber-400' : 'text-stone-300'} />
            </button>
          ))}
        </div>
      );
    };

    // ── PhotoGallery ───────────────────────────────────────────────────────

    const PhotoGallery = ({ photos }) => {
      const [idx, setIdx] = useState(0);
      if (!photos.length) return null;
      const prev = () => setIdx((idx - 1 + photos.length) % photos.length);
      const next = () => setIdx((idx + 1) % photos.length);
      return (
        <div className="relative bg-stone-900 select-none">
          <img src={photos[idx]} alt="" className="w-full h-72 object-cover" />
          {photos.length > 1 && (
            <>
              <button onClick={prev}
                className="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/40 backdrop-blur-sm text-white rounded-full flex items-center justify-center">
                <Ic n="chevL" size={18} />
              </button>
              <button onClick={next}
                className="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-black/40 backdrop-blur-sm text-white rounded-full flex items-center justify-center">
                <Ic n="chevR" size={18} />
              </button>
              <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">
                {photos.map((_, i) => (
                  <button key={i} onClick={() => setIdx(i)}
                    className={`rounded-full transition-all duration-200 ${i===idx ? 'w-4 h-1.5 bg-white' : 'w-1.5 h-1.5 bg-white/40'}`} />
                ))}
              </div>
            </>
          )}
        </div>
      );
    };

    // ── RestaurantCard ─────────────────────────────────────────────────────

    const RestaurantCard = ({ restaurant, onClick }) => {
      const { name, rating, visitDate, photos, comment } = restaurant;
      return (
        <div onClick={onClick}
          className="bg-white rounded-2xl shadow-sm overflow-hidden cursor-pointer active:scale-[0.98] transition-transform duration-100 flex items-stretch">
          <div className="w-24 flex-shrink-0">
            {photos.length > 0
              ? <img src={photos[0]} alt="" className="w-full h-full object-cover" />
              : <div className="w-full h-full flex items-center justify-center min-h-[88px]"
                  style={{ background: 'linear-gradient(135deg,#fff7ed,#ffedd5)' }}>
                  <Ic n="utensils" size={26} className="text-orange-200" />
                </div>
            }
          </div>
          <div className="flex-1 min-w-0 px-3.5 py-3">
            <h3 className="font-bold text-stone-900 text-[15px] leading-snug line-clamp-1">{name}</h3>
            <div className="flex items-center gap-2 mt-1.5">
              <Stars value={rating} size={11} />
              <span className="text-[11px] text-stone-400">{visitDate}</span>
            </div>
            {comment && (
              <p className="text-xs text-stone-500 mt-1.5 line-clamp-2 leading-relaxed">{comment}</p>
            )}
          </div>
        </div>
      );
    };

    // ── EmptyState ─────────────────────────────────────────────────────────

    const EmptyState = () => (
      <div className="h-full flex flex-col items-center justify-center gap-6 px-10 select-none">
        <svg viewBox="0 0 140 120" className="w-44 h-36 text-stone-200" fill="none"
          stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <ellipse cx="70" cy="68" rx="48" ry="8" strokeWidth="1" opacity="0.4" />
          <circle cx="70" cy="54" r="38" />
          <circle cx="70" cy="54" r="28" strokeDasharray="5 4" />
          <line x1="44" y1="28" x2="44" y2="50" />
          <line x1="40" y1="28" x2="40" y2="38" />
          <line x1="44" y1="28" x2="44" y2="38" />
          <line x1="48" y1="28" x2="48" y2="38" />
          <path d="M40 38 Q44 44 48 38" />
          <line x1="44" y1="50" x2="44" y2="76" />
          <line x1="96" y1="28" x2="96" y2="76" />
          <path d="M96 28 Q101 40 96 52" />
        </svg>
        <div className="text-center space-y-1.5">
          <p className="font-semibold text-stone-700 text-base">まだお店がありません</p>
          <p className="text-sm text-stone-400 leading-relaxed">
            下の ＋ ボタンからお気に入りの<br />お店を追加しましょう
          </p>
        </div>
      </div>
    );

    // ── ListView ───────────────────────────────────────────────────────────

    const ListView = ({ restaurants, onSelect }) => {
      const sorted = [...restaurants].sort((a, b) => b.visitDate.localeCompare(a.visitDate));
      if (!sorted.length) return <EmptyState />;
      return (
        <div className="h-full overflow-y-auto">
          <div className="p-4 space-y-2.5">
            {sorted.map(r => <RestaurantCard key={r.id} restaurant={r} onClick={() => onSelect(r)} />)}
          </div>
          <div className="h-2" />
        </div>
      );
    };

    // ── MapView ────────────────────────────────────────────────────────────

    const MapView = ({ restaurants, onSelect }) => {
      const containerRef = useRef(null);
      const mapRef = useRef(null);
      const markersRef = useRef([]);
      const onSelectRef = useRef(onSelect);
      onSelectRef.current = onSelect;

      useEffect(() => {
        if (mapRef.current) return;
        mapRef.current = L.map(containerRef.current).setView([35.6762, 139.6503], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom: 19,
        }).addTo(mapRef.current);
        return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
      }, []);

      useEffect(() => {
        if (!mapRef.current) return;
        markersRef.current.forEach(m => m.remove());
        markersRef.current = [];
        const withCoords = restaurants.filter(r => r.lat != null && r.lng != null);
        withCoords.forEach(r => {
          const marker = L.marker([r.lat, r.lng]).addTo(mapRef.current);
          marker.bindPopup(
            `<div style="min-width:150px;font-family:system-ui">` +
            `<div style="font-weight:700;font-size:14px;margin-bottom:4px">${escapeHtml(r.name)}</div>` +
            `<div style="color:#f59e0b;font-size:13px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>` +
            `<div style="color:#78716c;font-size:12px;margin-top:2px">${escapeHtml(r.visitDate)}</div></div>`
          );
          marker.on('click', () => { marker.openPopup(); onSelectRef.current(r); });
          markersRef.current.push(marker);
        });
        if (withCoords.length > 0) {
          const group = L.featureGroup(markersRef.current);
          try { mapRef.current.fitBounds(group.getBounds().pad(0.25), { maxZoom: 15 }); } catch (e) {}
        }
      }, [restaurants]);

      const noCoords = restaurants.filter(r => !r.lat).length;
      return (
        <div className="relative h-full">
          <div ref={containerRef} className="h-full w-full" />
          {noCoords > 0 && (
            <div className="absolute bottom-3 left-3 right-3 pointer-events-none">
              <div className="bg-white/95 backdrop-blur-sm rounded-2xl px-4 py-3 shadow-lg flex items-center gap-2.5">
                <Ic n="alert" size={15} className="text-amber-500 flex-shrink-0" />
                <p className="text-xs text-stone-600">
                  位置情報のないお店が <strong>{noCoords}</strong> 件あります。
                  編集から住所を設定できます。
                </p>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── Sheet (base modal) ─────────────────────────────────────────────────

    const Sheet = ({ onClose, maxH = '92vh', children }) => (
      <div className="fixed inset-0 z-50 flex flex-col justify-end">
        <div className="absolute inset-0 bg-stone-900/60" onClick={onClose} />
        <div className="relative bg-white rounded-t-3xl flex flex-col" style={{ maxHeight: maxH }}>
          <div className="flex justify-center pt-3 pb-1 flex-shrink-0">
            <div className="w-10 h-1 bg-stone-200 rounded-full" />
          </div>
          {children}
        </div>
      </div>
    );

    // ── Label ──────────────────────────────────────────────────────────────

    const Label = ({ children }) => (
      <p className="text-[11px] font-semibold text-stone-400 uppercase tracking-widest mb-2">{children}</p>
    );

    const inputCls = "w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-stone-900 placeholder-stone-300 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-shadow text-[15px]";

    // ── RestaurantForm ─────────────────────────────────────────────────────

    const RestaurantForm = ({ restaurant, onSave, onClose }) => {
      const isEdit = !!restaurant;
      const [form, setForm] = useState({
        name: restaurant?.name || '',
        address: restaurant?.address || '',
        lat: restaurant?.lat ?? null,
        lng: restaurant?.lng ?? null,
        rating: restaurant?.rating ?? 3,
        visitDate: restaurant?.visitDate || new Date().toISOString().split('T')[0],
        photos: restaurant?.photos ? [...restaurant.photos] : [],
        comment: restaurant?.comment || '',
      });
      const [geocoding, setGeocoding] = useState(false);

      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const handlePhotos = async (e) => {
        const files = Array.from(e.target.files).slice(0, 10 - form.photos.length);
        if (!files.length) return;
        const compressed = await Promise.all(files.map(compressImage));
        set('photos', [...form.photos, ...compressed].slice(0, 10));
      };

      const handleGeocode = async () => {
        if (!form.address) return;
        setGeocoding(true);
        try {
          const result = await geocodeAddress(form.address);
          if (result) setForm(f => ({ ...f, lat: result.lat, lng: result.lng }));
          else alert('住所が見つかりませんでした。より具体的な住所を試してください。');
        } catch { alert('位置情報の取得に失敗しました。'); }
        setGeocoding(false);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.name.trim()) return;
        onSave(validateRestaurant({ ...restaurant, ...form, id: restaurant?.id || Date.now() }));
      };

      return (
        <Sheet onClose={onClose}>
          <div className="flex items-center justify-between px-5 py-3 flex-shrink-0">
            <h2 className="font-bold text-stone-900 text-lg">{isEdit ? '編集' : 'お店を追加'}</h2>
            <button type="button" onClick={onClose}
              className="w-8 h-8 flex items-center justify-center rounded-full bg-stone-100 text-stone-500 hover:bg-stone-200 transition-colors">
              <Ic n="x" size={16} />
            </button>
          </div>

          <form onSubmit={handleSubmit} className="overflow-y-auto flex-1">
            <div className="px-5 pb-8 space-y-5">

              <div>
                <Label>店名</Label>
                <input required value={form.name} onChange={e => set('name', e.target.value)}
                  placeholder="例：銀座 鮨さいとう" className={inputCls} />
              </div>

              <div>
                <Label>住所</Label>
                <div className="flex gap-2">
                  <input value={form.address}
                    onChange={e => { set('address', e.target.value); set('lat', null); set('lng', null); }}
                    placeholder="例：東京都中央区銀座" className={inputCls + " flex-1"} />
                  <button type="button" onClick={handleGeocode}
                    disabled={geocoding || !form.address}
                    className="flex items-center gap-1.5 px-3 bg-stone-100 text-stone-600 rounded-xl text-sm font-medium hover:bg-stone-200 transition-colors disabled:opacity-40 flex-shrink-0 whitespace-nowrap">
                    <Ic n="mapPin" size={14} />
                    {geocoding ? '取得中' : '取得'}
                  </button>
                </div>
                {form.lat != null && (
                  <div className="flex items-center gap-1.5 mt-2 text-xs text-emerald-600">
                    <Ic n="check" size={13} />
                    位置情報を取得しました
                  </div>
                )}
              </div>

              <div>
                <Label>評価</Label>
                <StarPicker value={form.rating} onChange={v => set('rating', v)} />
              </div>

              <div>
                <Label>訪問日</Label>
                <input type="date" value={form.visitDate}
                  onChange={e => set('visitDate', e.target.value)} className={inputCls} />
              </div>

              <div>
                <Label>写真（{form.photos.length}/10）</Label>
                <div className="flex gap-2.5 flex-wrap">
                  {form.photos.map((p, i) => (
                    <div key={i} className="relative w-20 h-20">
                      <img src={p} className="w-full h-full object-cover rounded-xl" alt="" />
                      <button type="button"
                        onClick={() => set('photos', form.photos.filter((_,j) => j!==i))}
                        className="absolute -top-1.5 -right-1.5 w-5 h-5 bg-stone-800 text-white rounded-full flex items-center justify-center shadow-sm">
                        <Ic n="x" size={10} />
                      </button>
                    </div>
                  ))}
                  {form.photos.length < 10 && (
                    <label className="w-20 h-20 border-2 border-dashed border-stone-200 rounded-xl flex flex-col items-center justify-center gap-1 cursor-pointer hover:border-orange-400 hover:bg-orange-50 transition-colors text-stone-400">
                      <Ic n="camera" size={18} />
                      <span className="text-[10px]">追加</span>
                      <input type="file" accept="image/*" multiple className="hidden" onChange={handlePhotos} />
                    </label>
                  )}
                </div>
              </div>

              <div>
                <Label>コメント</Label>
                <textarea value={form.comment} onChange={e => set('comment', e.target.value)}
                  rows={4} placeholder="感想・おすすめメニュー・メモなど"
                  className={inputCls + " resize-none"} />
              </div>

              <button type="submit" disabled={!form.name.trim()}
                className="w-full py-4 bg-orange-600 text-white rounded-2xl font-bold text-base tracking-wide disabled:opacity-40 active:bg-orange-700 transition-colors">
                {isEdit ? '変更を保存' : 'お店を追加'}
              </button>
            </div>
          </form>
        </Sheet>
      );
    };

    // ── DetailModal ────────────────────────────────────────────────────────

    const DetailModal = ({ restaurant, onEdit, onDelete, onClose }) => {
      const { name, rating, visitDate, address, photos, comment, lat, lng } = restaurant;
      const mapsUrl = lat != null
        ? `https://www.google.com/maps?q=${lat},${lng}`
        : address ? `https://www.google.com/maps/search/${encodeURIComponent(address)}` : null;

      return (
        <Sheet onClose={onClose} maxH="88vh">
          <div className="overflow-y-auto flex-1">
            {photos.length > 0 && <PhotoGallery photos={photos} />}

            <div className="px-5 pt-4 pb-2">
              <h2 className="text-xl font-bold text-stone-900 leading-snug">{name}</h2>
              <div className="flex items-center gap-3 mt-2">
                <Stars value={rating} size={14} />
                <span className="text-sm text-stone-400">{visitDate}</span>
              </div>
            </div>

            {(address || mapsUrl || comment) && (
              <div className="px-5 py-3 space-y-3">
                {address && (
                  <div className="flex items-start gap-2.5">
                    <Ic n="mapPin" size={15} className="text-stone-400 mt-0.5 flex-shrink-0" />
                    <p className="text-sm text-stone-600 leading-relaxed">{address}</p>
                  </div>
                )}
                {mapsUrl && (
                  <a href={mapsUrl} target="_blank" rel="noopener noreferrer"
                    className="inline-flex items-center gap-1.5 text-sm font-medium text-orange-600 hover:text-orange-700">
                    Google Maps で開く
                    <Ic n="extLink" size={13} />
                  </a>
                )}
                {comment && (
                  <div className="pt-1 border-t border-stone-100">
                    <p className="text-sm text-stone-700 leading-relaxed whitespace-pre-wrap">{comment}</p>
                  </div>
                )}
              </div>
            )}
            <div className="h-2" />
          </div>

          <div className="px-5 py-4 border-t border-stone-100 flex gap-3 flex-shrink-0">
            <button onClick={onEdit}
              className="flex-1 flex items-center justify-center gap-2 py-3 border border-stone-200 rounded-xl font-medium text-stone-700 active:bg-stone-50 transition-colors">
              <Ic n="pencil" size={15} />
              編集
            </button>
            <button onClick={onDelete}
              className="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl font-medium text-red-500 bg-red-50 active:bg-red-100 transition-colors">
              <Ic n="trash" size={15} />
              削除
            </button>
          </div>
        </Sheet>
      );
    };

    // ── ImportModal ────────────────────────────────────────────────────────

    const ImportModal = ({ onImport, onClose }) => {
      const [preview, setPreview] = useState(null);
      const [error, setError] = useState('');

      const handleFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setError(''); setPreview(null);
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const text = ev.target.result;
            const parsed = file.name.toLowerCase().endsWith('.kml') ? parseKML(text) : parseCSV(text);
            if (!parsed.length) { setError('お店のデータが見つかりませんでした。'); return; }
            const today = new Date().toISOString().split('T')[0];
            setPreview(parsed.map(r => ({
              name: r.name, address: r.address||'',
              lat: r.lat, lng: r.lng,
              rating: 3, visitDate: today, photos: [], comment: '',
            })));
          } catch { setError('ファイルの読み込みに失敗しました。'); }
        };
        reader.readAsText(file, 'UTF-8');
      };

      return (
        <Sheet onClose={onClose} maxH="88vh">
          <div className="flex items-center justify-between px-5 py-3 flex-shrink-0">
            <h2 className="font-bold text-stone-900 text-lg">インポート</h2>
            <button onClick={onClose}
              className="w-8 h-8 flex items-center justify-center rounded-full bg-stone-100 text-stone-500">
              <Ic n="x" size={16} />
            </button>
          </div>

          <div className="overflow-y-auto flex-1 px-5 pb-8 space-y-4">
            <div className="bg-stone-50 border border-stone-100 rounded-2xl p-4">
              <div className="flex items-center gap-2 mb-3">
                <Ic n="info" size={15} className="text-orange-600 flex-shrink-0" />
                <p className="text-sm font-semibold text-stone-800">Google マイマップから取り込む</p>
              </div>
              <ol className="text-xs text-stone-500 space-y-1.5 list-decimal list-inside leading-relaxed">
                <li>マイマップを開き、マップ名の横の「︙」をタップ</li>
                <li>「KML にエクスポート」または「スプレッドシートにエクスポート」を選択</li>
                <li>ダウンロードしたファイルを下から選択</li>
              </ol>
            </div>

            <label className="flex flex-col items-center gap-4 py-10 border-2 border-dashed border-stone-200 rounded-2xl cursor-pointer hover:border-orange-400 hover:bg-orange-50 transition-colors group">
              <div className="w-14 h-14 bg-stone-100 group-hover:bg-orange-100 rounded-2xl flex items-center justify-center transition-colors">
                <Ic n="folder" size={24} className="text-stone-500 group-hover:text-orange-600 transition-colors" />
              </div>
              <div className="text-center">
                <p className="text-sm font-semibold text-stone-700">ファイルを選択</p>
                <p className="text-xs text-stone-400 mt-0.5">KML または CSV</p>
              </div>
              <input type="file" accept=".kml,.csv" className="hidden" onChange={handleFile} />
            </label>

            {error && (
              <div className="flex items-center gap-2 px-4 py-3 bg-red-50 text-red-600 rounded-xl text-sm">
                <Ic n="alert" size={15} className="flex-shrink-0" />
                {error}
              </div>
            )}

            {preview && (
              <div>
                <p className="text-sm font-semibold text-stone-700 mb-2.5">
                  {preview.length} 件のお店が見つかりました
                </p>
                <div className="border border-stone-100 rounded-2xl overflow-hidden divide-y divide-stone-100">
                  {preview.slice(0, 10).map((r, i) => (
                    <div key={i} className="flex items-center gap-3 px-4 py-2.5">
                      <div className={`w-2 h-2 rounded-full flex-shrink-0 ${r.lat != null ? 'bg-emerald-400' : 'bg-stone-200'}`} />
                      <span className="flex-1 text-sm text-stone-800 truncate">{r.name}</span>
                      {r.lat == null && <span className="text-[11px] text-stone-400">位置情報なし</span>}
                    </div>
                  ))}
                  {preview.length > 10 && (
                    <div className="px-4 py-2.5 text-xs text-stone-400">他 {preview.length-10} 件</div>
                  )}
                </div>
                <p className="text-xs text-stone-400 mt-2 leading-relaxed">
                  位置情報は追加後に住所から取得できます
                </p>
                <button onClick={() => onImport(preview)}
                  className="w-full mt-4 py-4 bg-orange-600 text-white rounded-2xl font-bold active:bg-orange-700 transition-colors">
                  {preview.length} 件をインポート
                </button>
              </div>
            )}
          </div>
        </Sheet>
      );
    };

    // ── App ────────────────────────────────────────────────────────────────

    const App = () => {
      const [restaurants, setRestaurants] = useState([]);
      const [view, setView] = useState('list');
      const [showForm, setShowForm] = useState(false);
      const [showImport, setShowImport] = useState(false);
      const [editingRestaurant, setEditingRestaurant] = useState(null);
      const [selectedRestaurant, setSelectedRestaurant] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      useEffect(() => {
        try {
          const saved = localStorage.getItem('food-log-v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) setRestaurants(parsed.map(validateRestaurant).filter(Boolean));
          }
        } catch {}
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
      }, []);

      const save = (data) => {
        setRestaurants(data);
        try { localStorage.setItem('food-log-v1', JSON.stringify(data)); }
        catch { alert('保存に失敗しました。写真のデータ量を減らしてください。'); }
      };

      const addR    = (r) => save([r, ...restaurants]);
      const updateR = (r) => save(restaurants.map(x => x.id===r.id ? r : x));
      const deleteR = (id) => {
        if (!confirm('このお店を削除しますか？')) return;
        save(restaurants.filter(x => x.id!==id));
        setSelectedRestaurant(null);
      };
      const importR = (list) => {
        save([...restaurants, ...list.map((r,i) => ({ ...r, id: Date.now()+i }))]);
        setShowImport(false);
      };

      const filtered = restaurants.filter(r => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return r.name.toLowerCase().includes(q) || r.comment.toLowerCase().includes(q) || r.address.toLowerCase().includes(q);
      });

      const openAdd  = () => { setEditingRestaurant(null); setShowForm(true); };
      const openEdit = (r) => { setEditingRestaurant(r); setSelectedRestaurant(null); setShowForm(true); };

      return (
        <div className="flex flex-col bg-stone-50 overflow-hidden" style={{ height:'100dvh' }}>

          {/* Header */}
          <header className="bg-white border-b border-stone-100 flex-shrink-0">
            <div className="flex items-center gap-3 px-4 h-14">
              <div className="w-8 h-8 bg-orange-600 rounded-xl flex items-center justify-center flex-shrink-0">
                <Ic n="utensils" size={16} className="text-white" strokeWidth={2.5} />
              </div>
              <span className="font-bold text-stone-900 text-[15px] whitespace-nowrap">ごはん日記</span>
              <div className="flex-1 relative">
                <Ic n="search" size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 pointer-events-none" />
                <input type="search" placeholder="検索" value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full pl-8 pr-3 py-2 text-sm bg-stone-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all placeholder-stone-400" />
              </div>
              <button onClick={() => setShowImport(true)}
                className="w-8 h-8 flex items-center justify-center rounded-xl text-stone-400 hover:text-orange-600 hover:bg-stone-100 transition-colors flex-shrink-0">
                <Ic n="download" size={18} />
              </button>
            </div>
          </header>

          {/* Content */}
          <div className="flex-1 overflow-hidden relative">
            {view === 'list'
              ? <ListView restaurants={filtered} onSelect={setSelectedRestaurant} />
              : <MapView restaurants={filtered} onSelect={setSelectedRestaurant} />
            }
          </div>

          {/* Bottom nav */}
          <nav className="bg-white border-t border-stone-100 flex items-end justify-around flex-shrink-0 pb-safe" style={{ height:64 }}>
            <button onClick={() => setView('list')}
              className={`flex flex-col items-center gap-1 px-10 pb-2 pt-2 transition-colors ${view==='list' ? 'text-orange-600' : 'text-stone-400'}`}>
              <Ic n="grid" size={22} />
              <span className="text-[10px] font-semibold tracking-wide">一覧</span>
            </button>
            <button onClick={openAdd}
              className="w-14 h-14 bg-orange-600 rounded-full flex items-center justify-center shadow-lg shadow-orange-200 -mt-5 flex-shrink-0 active:bg-orange-700 transition-colors">
              <Ic n="plus" size={26} className="text-white" strokeWidth={2.5} />
            </button>
            <button onClick={() => setView('map')}
              className={`flex flex-col items-center gap-1 px-10 pb-2 pt-2 transition-colors ${view==='map' ? 'text-orange-600' : 'text-stone-400'}`}>
              <Ic n="map" size={22} />
              <span className="text-[10px] font-semibold tracking-wide">地図</span>
            </button>
          </nav>

          {/* Modals */}
          {showForm && (
            <RestaurantForm
              restaurant={editingRestaurant}
              onSave={(r) => { editingRestaurant ? updateR(r) : addR(r); setShowForm(false); setEditingRestaurant(null); }}
              onClose={() => { setShowForm(false); setEditingRestaurant(null); }}
            />
          )}
          {showImport && <ImportModal onImport={importR} onClose={() => setShowImport(false)} />}
          {selectedRestaurant && (
            <DetailModal
              restaurant={selectedRestaurant}
              onEdit={() => openEdit(selectedRestaurant)}
              onDelete={() => deleteR(selectedRestaurant.id)}
              onClose={() => setSelectedRestaurant(null)}
            />
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
