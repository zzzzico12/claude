<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Pixel Art</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: #f5f4f0;
    color: #1a1a18;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }
  #app { width: 100%; max-width: 560px; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 24px; }

  #apikey-bar {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 14px; background: #fff;
    border: 0.5px solid #dddbd0; border-radius: 12px; margin-bottom: 20px;
  }
  #apikey-label { font-size: 12px; color: #888780; white-space: nowrap; }
  #apikey-input {
    flex: 1; font-size: 13px; font-family: 'Courier New', monospace;
    border: none; outline: none; background: transparent; color: #1a1a18;
  }
  #apikey-status { font-size: 11px; white-space: nowrap; }
  .status-ok { color: #1d9e75; }
  .status-ng { color: #e24b4a; }

  #stage-wrap {
    background: #f0efe8;
    border: 0.5px solid #dddbd0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
  }
  #stage-canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100%;
    display: block;
    border-radius: 4px;
  }

  #mood-desc {
    font-size: 13px; color: #888780; margin-bottom: 20px;
    min-height: 20px; text-align: center;
  }

  #dl-row { display: none; align-items: center; gap: 8px; margin-bottom: 14px; }
  #dl-btn {
    flex: 1; padding: 8px; font-size: 13px;
    border: 0.5px solid #dddbd0; border-radius: 8px;
    background: #fff; color: #5f5e5a; cursor: pointer;
    font-family: inherit; transition: background 0.15s;
  }
  #dl-btn:hover { background: #f5f4f0; }
  #dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #dl-loops {
    width: 48px; font-size: 13px; padding: 4px 6px;
    border: 0.5px solid #dddbd0; border-radius: 6px; text-align: center;
  }

  #input-area { display: flex; gap: 8px; margin-bottom: 14px; }
  #mood-input {
    flex: 1; padding: 8px 12px; font-size: 15px;
    border: 0.5px solid #dddbd0; border-radius: 8px;
    outline: none; background: #fff; color: #1a1a18; font-family: inherit;
  }
  #mood-input:focus { border-color: #b4b2a9; }
  #go-btn {
    padding: 8px 20px; font-size: 14px; white-space: nowrap;
    border: 0.5px solid #dddbd0; border-radius: 8px;
    background: #1a1a18; color: #f5f4f0;
    cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  #go-btn:hover { opacity: 0.85; }
  #go-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  #examples { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
  .ex-chip {
    font-size: 12px; padding: 5px 12px; border-radius: 100px;
    border: 0.5px solid #dddbd0; background: #fff; color: #5f5e5a;
    cursor: pointer; transition: background 0.15s; font-family: inherit;
  }
  .ex-chip:hover { background: #f5f4f0; }

  #history-section { margin-top: 8px; }
  #history-title {
    font-size: 12px; color: #888780; margin-bottom: 10px;
    border-top: 0.5px solid #dddbd0; padding-top: 20px;
  }
  #history-list { display: flex; flex-direction: column; gap: 8px; }
  .hist-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border: 0.5px solid #dddbd0;
    border-radius: 8px; background: #fff; cursor: pointer;
    transition: border-color 0.15s;
  }
  .hist-item:hover { border-color: #b4b2a9; }
  .hist-thumb {
    width: 56px; height: 56px; flex-shrink: 0;
    image-rendering: pixelated; border-radius: 4px;
  }
  .hist-meta { flex: 1; min-width: 0; }
  .hist-mood { font-size: 13px; font-weight: 500; color: #1a1a18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-label { font-size: 12px; color: #5f5e5a; margin-top: 3px; }
  .hist-time { font-size: 11px; color: #888780; margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
  <h1>Mood Pixel Art</h1>

  <div id="apikey-bar">
    <span id="apikey-label">APIキー</span>
    <input type="password" id="apikey-input" placeholder="sk-ant-api03-..." oninput="onKeyInput()" />
    <span id="apikey-status" class="status-ng">未設定</span>
  </div>

  <div id="stage-wrap">
    <canvas id="stage-canvas" width="384" height="384"></canvas>
  </div>

  <div id="dl-row">
    <button id="dl-btn" onclick="downloadVideo()">動画でダウンロード (.mp4)</button>
    <input type="number" id="dl-loops" value="5" min="1" max="20" title="ループ回数" />
    <span style="font-size:12px;color:#888780;white-space:nowrap">回ループ</span>
  </div>

  <div id="input-area">
    <input type="text" id="mood-input" placeholder="今の気持ちを自由に入力..." maxlength="60" />
<button id="go-btn" onclick="generate()" disabled>生成</button>
  </div>

  <div id="examples">
    <span class="ex-chip" onclick="quickGen('なんか今日テンション爆上がり！')">テンション爆上がり</span>
    <span class="ex-chip" onclick="quickGen('眠くて死にそう')">眠くて死にそう</span>
    <span class="ex-chip" onclick="quickGen('推しに会えて感激')">推しに会えて感激</span>
    <span class="ex-chip" onclick="quickGen('月曜日がつらい')">月曜日がつらい</span>
    <span class="ex-chip" onclick="quickGen('コーヒーがうまい')">コーヒーがうまい</span>
    <span class="ex-chip" onclick="quickGen('締め切り明日でやばい')">締め切りやばい</span>
  </div>

  <div id="history-section" style="display:none">
    <div id="history-title">これまでの気分</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
const BLOCK = 12;
const GRID = 32;
const PALETTE = ['#f0efe8', '#d0cfc4', '#888880', '#2A2A2A'];

const PROVIDERS = [
  {
    name: 'Anthropic', label: 'Anthropic',
    pattern: /^sk-ant-/,
    valid: k => k.startsWith('sk-ant-') && k.length > 20,
    request(key, prompt) {
      return {
        url: '/api/messages',
        headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 16000, messages: [{ role: 'user', content: prompt }] }),
      };
    },
    parse(data) {
      if (data.error) throw new Error(data.error.message);
      return data.content[0].text;
    },
  },
  {
    name: 'OpenAI', label: 'OpenAI',
    pattern: /^sk-/,
    valid: k => k.startsWith('sk-') && k.length > 20,
    request(key, prompt) {
      return {
        url: 'https://api.openai.com/v1/chat/completions',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({ model: 'gpt-4o', max_tokens: 16000, messages: [{ role: 'user', content: prompt }] }),
      };
    },
    parse(data) {
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    },
  },
  {
    name: 'Gemini', label: 'Google Gemini',
    pattern: /^AIza/,
    valid: k => k.startsWith('AIza') && k.length > 20,
    request(key, prompt) {
      return {
        url: `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }], generationConfig: { maxOutputTokens: 16000 } }),
      };
    },
    parse(data) {
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts[0].text;
    },
  },
  {
    name: 'Groq', label: 'Groq',
    pattern: /^gsk_/,
    valid: k => k.startsWith('gsk_') && k.length > 20,
    request(key, prompt) {
      return {
        url: 'https://api.groq.com/openai/v1/chat/completions',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({ model: 'llama-3.3-70b-versatile', max_tokens: 16000, messages: [{ role: 'user', content: prompt }] }),
      };
    },
    parse(data) {
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    },
  },
  {
    name: 'OpenRouter', label: 'OpenRouter',
    pattern: /^sk-or-/,
    valid: k => k.startsWith('sk-or-') && k.length > 20,
    request(key, prompt) {
      return {
        url: 'https://openrouter.ai/api/v1/chat/completions',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify({ model: 'anthropic/claude-sonnet-4-5', max_tokens: 16000, messages: [{ role: 'user', content: prompt }] }),
      };
    },
    parse(data) {
      if (data.error) throw new Error(data.error.message);
      return data.choices[0].message.content;
    },
  },
];

let animTimer = null, loadingRaf = null, loadingT = 0;
let history = [], currentFrames = [], currentFrame = 0, currentSpeed = 400, apiKey = '', currentProvider = null;
const canvas = document.getElementById('stage-canvas');
const ctx = canvas.getContext('2d');
const input = document.getElementById('mood-input');
const goBtn = document.getElementById('go-btn');

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !goBtn.disabled) generate(); });

function drawGrid(frame, targetCtx = ctx, block = BLOCK) {
  targetCtx.fillStyle = PALETTE[0];
  targetCtx.fillRect(0, 0, GRID * block, GRID * block);
  const pixels = frame.p ?? frame;
  for (const px of pixels) {
    const [r, c, v] = px;
    if (v >= 1 && v <= 3) {
      targetCtx.fillStyle = PALETTE[v];
      targetCtx.fillRect(c * block, r * block, block, block);
    }
  }
}

function drawMessage(text) {
  ctx.fillStyle = PALETTE[0];
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#888780';
  ctx.font = '14px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function frameToThumbURL(grid) {
  const tc = document.createElement('canvas');
  tc.width = GRID * 4; tc.height = GRID * 4;
  drawGrid(grid, tc.getContext('2d'), 4);
  return tc.toDataURL();
}

function stopLoadingAnim() {
  if (loadingRaf) { cancelAnimationFrame(loadingRaf); loadingRaf = null; }
}

function startLoadingAnim() {
  stopLoadingAnim();
  loadingT = 0;
  const dotSize = BLOCK * 2;
  const gap = BLOCK * 3;
  const totalW = 3 * dotSize + 2 * gap;
  const startX = Math.round((canvas.width - totalW) / 2);
  const baseY = canvas.height / 2;
  function tick() {
    loadingT++;
    ctx.fillStyle = PALETTE[0];
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = PALETTE[3];
    for (let i = 0; i < 3; i++) {
      const dy = Math.sin((loadingT * 0.06) + i * 1.1) * BLOCK * 2.5;
      ctx.fillRect(startX + i * (dotSize + gap), Math.round(baseY + dy - dotSize / 2), dotSize, dotSize);
    }
    loadingRaf = requestAnimationFrame(tick);
  }
  loadingRaf = requestAnimationFrame(tick);
}

function stopAnim() { if (animTimer) { clearInterval(animTimer); animTimer = null; } }

function startAnim(frames, speed) {
  stopAnim();
  currentFrames = frames; currentFrame = 0; currentSpeed = speed || 400;
  drawGrid(frames[0]);
  animTimer = setInterval(() => {
    currentFrame = (currentFrame + 1) % currentFrames.length;
    drawGrid(currentFrames[currentFrame]);
  }, currentSpeed);
  document.getElementById('dl-row').style.display = 'flex';
}

function setLoading(on) {
  goBtn.disabled = on;
  if (on) {
    stopAnim();
    startLoadingAnim();
  } else {
    stopLoadingAnim();
  }
}

function addHistory(mood, frames, speed, label) {
  history.unshift({ mood, thumb: frameToThumbURL(frames[0]), frames, speed, label, time: new Date() });
  if (history.length > 5) history.pop();
  renderHistory();
}

function renderHistory() {
  const sec = document.getElementById('history-section');
  const list = document.getElementById('history-list');
  if (!history.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = history.map((h, i) => `
    <div class="hist-item" onclick="replayHistory(${i})">
      <img class="hist-thumb" src="${h.thumb}" />
      <div class="hist-meta">
        <div class="hist-mood">${esc(h.mood)}</div>

        <div class="hist-time">${h.time.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    </div>`).join('');
}

function replayHistory(i) {
  input.value = history[i].mood;
  startAnim(history[i].frames, history[i].speed);
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function sanitizeMood(s) {
  return s.replace(/[\u0000-\u001f\u007f」「\`]/g, '').slice(0, 60);
}
function validateFrames(frames) {
  if (!Array.isArray(frames) || frames.length < 1) throw new Error('framesが不正です');
  for (const frame of frames) {
    const pixels = frame.p ?? frame;
    if (!Array.isArray(pixels)) throw new Error('フレーム形式が不正です');
    for (const px of pixels) {
      if (!Array.isArray(px) || px.length !== 3) throw new Error('ピクセル形式が不正です');
      const [r, c, v] = px;
      if (r < 0 || r >= GRID || c < 0 || c >= GRID || v < 1 || v > 3) throw new Error('ピクセル値が範囲外です');
    }
  }
}
async function quickGen(t) { input.value = t; await generate(); }

function onKeyInput() {
  const val = document.getElementById('apikey-input').value.trim();
  apiKey = val;
  const status = document.getElementById('apikey-status');
  const provider = PROVIDERS.find(p => p.valid(val));
  if (provider) {
    currentProvider = provider;
    status.textContent = provider.label; status.className = 'status-ok';
    goBtn.disabled = false;
    drawMessage('気持ちを入力して生成してみよう');
  } else {
    currentProvider = null;
    status.textContent = val.length > 0 ? '未対応のキー' : '未設定';
    status.className = 'status-ng';
    goBtn.disabled = true;
  }
}

async function downloadVideo() {
  if (!currentFrames.length) return;
  const btn = document.getElementById('dl-btn');
  const loops = parseInt(document.getElementById('dl-loops').value) || 5;
  btn.disabled = true;
  btn.textContent = 'エンコード中...';

  try {
    const { Muxer, ArrayBufferTarget } = await import('https://esm.sh/mp4-muxer@4');

    const W = GRID * BLOCK, H = GRID * BLOCK;
    const target = new ArrayBufferTarget();
    const muxer = new Muxer({
      target,
      video: { codec: 'avc', width: W, height: H },
      fastStart: 'in-memory',
    });

    const encoder = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: e => { throw e; },
    });
    encoder.configure({
      codec: 'avc1.42001f',
      width: W, height: H,
      bitrate: 1_500_000,
    });

    const vc = document.createElement('canvas');
    vc.width = W; vc.height = H;
    const vx = vc.getContext('2d');

    const frameDuration = currentSpeed * 1000;
    let timestamp = 0;
    for (let i = 0; i < loops; i++) {
      for (const frame of currentFrames) {
        drawGrid(frame, vx, BLOCK);
        const vf = new VideoFrame(vc, { timestamp, duration: frameDuration });
        encoder.encode(vf, { keyFrame: timestamp === 0 });
        vf.close();
        timestamp += frameDuration;
      }
    }

    await encoder.flush();
    muxer.finalize();

    const blob = new Blob([target.buffer], { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'mood.mp4'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch(e) {
    console.error(e);
    alert('MP4エンコードに失敗しました: ' + e.message);
  }

  btn.disabled = false;
  btn.textContent = '動画でダウンロード (.mp4)';
}

async function generate() {
  const mood = sanitizeMood(input.value.trim());
  if (!mood || !apiKey) return;
  setLoading(true);

  const prompt = `ユーザーの気持ち:「${mood}」

この気持ちを表現する32x32グレースケールドット絵キャラクターを作ってください。
必ずJSON形式のみで返してください（コードブロック・説明文不要）:
{"frames":[{"p":[[行,列,値],...]},...],"speed":150,"label":"一言コメント"}

ルール:
- framesは5つのアニメーションフレーム（ループ再生される）
- 各フレームは {"p": [[行,列,値], ...]} の形式（スパース形式）
  ・行・列は0〜31の整数
  ・値: 1=ハイライト（明るいグレー）、2=ミッドトーン（中間グレー）、3=ダーク（黒に近い）
  ・背景(0)のピクセルは省略する（記述しない）
- シェーディングで立体感を表現（光源を左上として影を付ける）
- 必ず以下のテンプレートに従ったちびキャラを描くこと:

【体の配置（固定）】
  頭部輪郭: row2〜row15, col8〜col23（縦14px × 横16px の大きな丸い頭）
  胴体:     row16〜row22, col11〜col20
  左腕:     row17〜row21, col7〜col10
  右腕:     row17〜row21, col21〜col24
  左足:     row23〜row29, col10〜col14
  右足:     row23〜row29, col17〜col21

【顔のパーツ（必須・感情に合わせて形を変える）】
  左目:  row7〜row9, col11〜col13 — 喜び=丸く大きい, 悲しみ=細い, 怒り=斜め眉
  右目:  row7〜row9, col19〜col21 — 同上
  口:    row12〜row13, col13〜col19 — 喜び=Uの字, 悲しみ=逆U, 驚き=O型, 怒り=への字
  眉:    row5〜row6, col11〜col21 — 感情を眉の角度で強調

【アニメーション（5フレームで1ループ）】
  腕・足のみ動かす（頭と胴体の位置はフレーム間で変えない）
  各フレームで腕を3〜6px、足を3〜5px動かしてダイナミックに
  感情に合った動き: 喜び=両腕バンザイ往復, 悲しみ=うなだれ, 怒り=腕ぶんぶん
- speed: 感情強度に応じて100〜800ms（興奮100、普通200、眠い800）
- label: 共感コメント20文字以内
- 改行・スペース・インデントなしの1行コンパクトJSONで返す
- JSONのみ返す`;

  try {
    const { url, headers, body } = currentProvider.request(apiKey, prompt);
    const res = await fetch(url, { method: 'POST', headers, body });
    const data = await res.json();
    const text = currentProvider.parse(data);
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('JSONが見つかりません');
    const parsed = JSON.parse(jsonMatch[0]);
    validateFrames(parsed.frames);
    const speed = typeof parsed.speed === 'number' && parsed.speed > 0 ? parsed.speed : 400;
    startAnim(parsed.frames, speed);
    addHistory(mood, parsed.frames, speed, typeof parsed.label === 'string' ? parsed.label.slice(0, 40) : '');
  } catch(e) {
    stopAnim();
    drawMessage('エラー: ' + e.message.slice(0, 40));
  }
  setLoading(false);
}

drawMessage('APIキーを入力してね');
</script>
</body>
</html>
