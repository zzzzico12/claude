<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WINE LIST AI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wine AI">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── アイコン ──────────────────────────────────────────────────
    const Icon = ({ className, size = 24, children }) => (
      <svg className={className} width={size} height={size} xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );
    const Wine = ({ className, size }) => (
      <Icon className={className} size={size}>
        <path d="M8 22h8"/><path d="M7 10h10"/><path d="M12 15v7"/>
        <path d="M12 15a5 5 0 0 0 5-5c0-2-.5-4-2-8H9c-1.5 4-2 6-2 8a5 5 0 0 0 5 5z"/>
      </Icon>
    );
    const MapPin = ({ className, size }) => (
      <Icon className={className} size={size}>
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </Icon>
    );
    const Droplet = ({ className, size }) => (
      <Icon className={className} size={size}>
        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
      </Icon>
    );
    const Sparkles = ({ className, size }) => (
      <Icon className={className} size={size}>
        <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"/>
        <path d="M5 3l.6 1.8L7.4 5l-1.8.6L5 7.4l-.6-1.8L2.6 5l1.8-.6z"/>
        <path d="M19 13l.6 1.8 1.8.6-1.8.6L19 17.8l-.6-1.8-1.8-.6 1.8-.6z"/>
      </Icon>
    );
    const Upload = ({ className, size }) => (
      <Icon className={className} size={size}>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </Icon>
    );
    const Loader2 = ({ className, size }) => (
      <Icon className={className} size={size}>
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </Icon>
    );
    const Camera = ({ className, size }) => (
      <Icon className={className} size={size}>
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </Icon>
    );
    const X = ({ className, size }) => (
      <Icon className={className} size={size}>
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </Icon>
    );

    // ── メインコンポーネント ──────────────────────────────────────
    const WineApp = () => {
      const [selectedWine, setSelectedWine] = useState(null);
      const [filterType, setFilterType] = useState('all');
      const [wines, setWines] = useState([]);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [uploadedImage, setUploadedImage] = useState(null);
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('wine-ai-apikey') || '');
      const [showKeyInput, setShowKeyInput] = useState(false);

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('wine-ai-apikey', key);
      };

      const analyzeWineMenu = async (imageData) => {
        if (!apiKey) {
          setShowKeyInput(true);
          return;
        }
        setIsAnalyzing(true);
        try {
          const response = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true",
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 4000,
              messages: [{
                role: "user",
                content: [
                  {
                    type: "image",
                    source: { type: "base64", media_type: "image/jpeg", data: imageData }
                  },
                  {
                    type: "text",
                    text: `この画像はワインメニューです。画像から以下の情報を抽出して、JSON形式で返してください。

重要: あなたの回答は有効なJSONオブジェクトのみである必要があります。JSONの外側にテキストやバッククォートを含めないでください。

各ワインについて以下の情報を抽出してください：
- name: ワインの日本語名
- nameEn: ワインの英語名（わかる場合）
- origin: 産地（国と地域）
- color: "red"、"white"、"sparkling"のいずれか
- colorJa: "赤ワイン"、"白ワイン"、"スパークリング"など
- taste: "辛口"、"甘口"、"やや辛口"、"やや甘口"など
- body: "フルボディ"、"ミディアムボディ"、"ライトボディ"
- description: ワインの特徴や説明
- price: 価格（¥記号付き）

以下の形式で返してください：
{
  "wines": [
    {
      "id": 1,
      "name": "ワイン名",
      "nameEn": "Wine Name",
      "origin": "フランス ボルドー",
      "color": "red",
      "colorJa": "赤ワイン",
      "taste": "辛口",
      "body": "フルボディ",
      "description": "説明文",
      "price": "¥10,000",
      "recommended": false
    }
  ]
}

情報が不明な場合は、合理的な推測をしてください。必ず有効なJSONのみを返してください。`
                  }
                ]
              }]
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error?.message || 'API error');
          let responseText = data.content[0].text;
          responseText = responseText.replace(/```json\n?/g, "").replace(/```\n?/g, "").trim();
          const result = JSON.parse(responseText);
          if (result.wines && Array.isArray(result.wines)) setWines(result.wines);
        } catch (error) {
          console.error("Error:", error);
          alert("メニューの解析に失敗しました。APIキーを確認してください。\n" + error.message);
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleImageUpload = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => setUploadedImage(e.target.result);
        reader.readAsDataURL(file);
        const base64Data = await new Promise((resolve, reject) => {
          const r2 = new FileReader();
          r2.onload = () => resolve(r2.result.split(",")[1]);
          r2.onerror = () => reject(new Error("Failed to read file"));
          r2.readAsDataURL(file);
        });
        await analyzeWineMenu(base64Data);
      };

      const getColorBadgeStyle = (color) => ({
        red: 'bg-red-100 text-red-800 border-red-300',
        white: 'bg-yellow-50 text-yellow-800 border-yellow-300',
        sparkling: 'bg-blue-50 text-blue-800 border-blue-300',
      }[color] || 'bg-gray-100 text-gray-800');

      const getColorIcon = (color) => color === 'red' ? '🍷' : '🥂';

      const filteredWines = filterType === 'all' ? wines : wines.filter(w => w.color === filterType);
      const recommendedWines = wines.filter(w => w.recommended);

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-red-50 p-6">
          <div className="max-w-6xl mx-auto">

            {/* ヘッダー */}
            <div className="text-center mb-10">
              <div className="flex items-center justify-center mb-4">
                <Wine className="w-12 h-12 text-purple-600 mr-3" size={48} />
                <h1 className="text-4xl font-bold text-gray-800">WINE LIST AI</h1>
              </div>
              <p className="text-gray-600">メニューの写真をアップロードしてください</p>
              <button
                onClick={() => setShowKeyInput(!showKeyInput)}
                className="mt-2 text-sm text-purple-500 underline"
              >
                {apiKey ? '✓ APIキー設定済み' : 'APIキーを設定'}
              </button>
            </div>

            {/* APIキー入力 */}
            {showKeyInput && (
              <div className="mb-6 bg-white rounded-2xl shadow-lg p-6 border border-purple-200">
                <h3 className="font-bold text-gray-800 mb-2">Anthropic APIキー</h3>
                <p className="text-sm text-gray-500 mb-3">キーはブラウザのlocalStorageにのみ保存されます。</p>
                <div className="flex gap-2">
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => saveApiKey(e.target.value)}
                    placeholder="sk-ant-..."
                    className="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500 font-mono text-sm"
                  />
                  <button
                    onClick={() => setShowKeyInput(false)}
                    className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700"
                  >
                    保存
                  </button>
                </div>
              </div>
            )}

            {/* アップロードエリア */}
            {wines.length === 0 && (
              <div className="mb-10">
                <div className="bg-white rounded-2xl shadow-lg p-8 border-2 border-dashed border-purple-300">
                  <div className="text-center">
                    <Camera className="w-16 h-16 text-purple-400 mx-auto mb-4" size={64} />
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">ワインメニューをアップロード</h2>
                    <p className="text-gray-600 mb-6">写真を選択すると自動的に解析します</p>
                    <label className="inline-block">
                      <input type="file" accept="image/*" onChange={handleImageUpload}
                             className="hidden" disabled={isAnalyzing} />
                      <div className="px-8 py-4 bg-purple-600 text-white rounded-xl hover:bg-purple-700 transition-colors cursor-pointer font-semibold inline-flex items-center">
                        {isAnalyzing ? (
                          <><Loader2 className="w-5 h-5 mr-2 animate-spin" size={20} />解析中...</>
                        ) : (
                          <><Upload className="w-5 h-5 mr-2" size={20} />写真を選択</>
                        )}
                      </div>
                    </label>
                    {uploadedImage && (
                      <div className="mt-6">
                        <img src={uploadedImage} alt="Uploaded menu"
                             className="max-w-md mx-auto rounded-lg shadow-md" />
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ワインリスト表示 */}
            {wines.length > 0 && (
              <>
                <div className="mb-6 text-center">
                  <label className="inline-block">
                    <input type="file" accept="image/*" onChange={handleImageUpload}
                           className="hidden" disabled={isAnalyzing} />
                    <div className="px-6 py-3 bg-white text-purple-600 border-2 border-purple-600 rounded-xl hover:bg-purple-50 transition-colors cursor-pointer font-semibold inline-flex items-center">
                      {isAnalyzing ? (
                        <><Loader2 className="w-5 h-5 mr-2 animate-spin" size={20} />解析中...</>
                      ) : (
                        <><Upload className="w-5 h-5 mr-2" size={20} />別のメニューを読み込む</>
                      )}
                    </div>
                  </label>
                </div>

                {recommendedWines.length > 0 && (
                  <div className="mb-10 bg-white rounded-2xl shadow-lg p-6 border-2 border-purple-200">
                    <div className="flex items-center mb-4">
                      <Sparkles className="w-6 h-6 text-purple-600 mr-2" size={24} />
                      <h2 className="text-2xl font-bold text-gray-800">本日のおすすめ</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {recommendedWines.map(wine => (
                        <div key={wine.id} onClick={() => setSelectedWine(wine)}
                             className="bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-4 cursor-pointer hover:shadow-md transition-all border border-purple-200">
                          <div className="flex justify-between items-start mb-2">
                            <div>
                              <h3 className="font-bold text-lg text-gray-800">{wine.name}</h3>
                              <p className="text-sm text-gray-600">{wine.nameEn}</p>
                            </div>
                            <span className="text-2xl">{getColorIcon(wine.color)}</span>
                          </div>
                          <p className="text-purple-600 font-semibold text-lg">{wine.price}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="flex gap-3 mb-6 flex-wrap justify-center">
                  {[
                    ['all', 'すべて', 'bg-purple-600'],
                    ['red', '🍷 赤ワイン', 'bg-red-600'],
                    ['white', '🥂 白ワイン', 'bg-yellow-600'],
                    ['sparkling', '🍾 スパークリング', 'bg-blue-600'],
                  ].map(([type, label, activeCls]) => (
                    <button key={type} onClick={() => setFilterType(type)}
                            className={`px-6 py-2 rounded-full font-semibold transition-all ${
                              filterType === type
                                ? `${activeCls} text-white shadow-lg`
                                : 'bg-white text-gray-700 hover:bg-gray-100'
                            }`}>
                      {label}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredWines.map(wine => (
                    <div key={wine.id} onClick={() => setSelectedWine(wine)}
                         className="bg-white rounded-2xl shadow-lg overflow-hidden cursor-pointer hover:shadow-2xl transition-all transform hover:-translate-y-1">
                      <div className="p-6">
                        <div className="flex justify-between items-start mb-3">
                          <div className="flex-1">
                            <h3 className="font-bold text-xl text-gray-800 mb-1">{wine.name}</h3>
                            <p className="text-sm text-gray-500">{wine.nameEn}</p>
                          </div>
                          <span className="text-3xl ml-2">{getColorIcon(wine.color)}</span>
                        </div>
                        <div className="space-y-2 mb-4">
                          <div className="flex items-center text-sm">
                            <MapPin className="w-4 h-4 text-gray-400 mr-2" size={16} />
                            <span className="text-gray-600">{wine.origin}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${getColorBadgeStyle(wine.color)}`}>
                              {wine.colorJa}
                            </span>
                            <span className="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-700">
                              {wine.taste}
                            </span>
                          </div>
                        </div>
                        <p className="text-gray-600 text-sm mb-4 line-clamp-2">{wine.description}</p>
                        <div className="flex justify-between items-center pt-4 border-t">
                          <span className="text-2xl font-bold text-purple-600">{wine.price}</span>
                          <button className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors text-sm font-semibold">
                            詳細を見る
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* 詳細モーダル */}
            {selectedWine && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
                   onClick={() => setSelectedWine(null)}>
                <div className="bg-white rounded-3xl max-w-2xl w-full p-8 max-h-[90vh] overflow-y-auto"
                     onClick={(e) => e.stopPropagation()}>
                  <div className="flex justify-between items-start mb-6">
                    <div className="flex-1">
                      <h2 className="text-3xl font-bold text-gray-800 mb-2">{selectedWine.name}</h2>
                      <p className="text-lg text-gray-600">{selectedWine.nameEn}</p>
                    </div>
                    <span className="text-5xl">{getColorIcon(selectedWine.color)}</span>
                  </div>
                  <div className="space-y-4 mb-6">
                    <div className="flex items-center">
                      <MapPin className="w-5 h-5 text-purple-600 mr-3" size={20} />
                      <div>
                        <p className="text-sm text-gray-500">産地</p>
                        <p className="text-lg font-semibold text-gray-800">{selectedWine.origin}</p>
                      </div>
                    </div>
                    <div className="flex items-center">
                      <Droplet className="w-5 h-5 text-purple-600 mr-3" size={20} />
                      <div>
                        <p className="text-sm text-gray-500">種類</p>
                        <p className="text-lg font-semibold text-gray-800">{selectedWine.colorJa}</p>
                      </div>
                    </div>
                    <div className="flex items-center">
                      <Wine className="w-5 h-5 text-purple-600 mr-3" size={20} />
                      <div>
                        <p className="text-sm text-gray-500">味わい</p>
                        <p className="text-lg font-semibold text-gray-800">{selectedWine.taste} / {selectedWine.body}</p>
                      </div>
                    </div>
                  </div>
                  <div className="bg-purple-50 rounded-2xl p-6 mb-6">
                    <h3 className="font-bold text-lg text-gray-800 mb-2">テイスティングノート</h3>
                    <p className="text-gray-700">{selectedWine.description}</p>
                  </div>
                  <div className="flex items-center justify-between pt-6 border-t">
                    <span className="text-3xl font-bold text-purple-600">{selectedWine.price}</span>
                    <button onClick={() => setSelectedWine(null)}
                            className="px-6 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 transition-colors font-semibold">
                      閉じる
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<WineApp />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
