[project]
name = "forest-change-detector"
version = "0.1.0"
description = "Day05：衛星画像（Sentinel-2）の NDVI の変化で森の減少を検知する（データ処理）"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "rasterio>=1.4",
  "scipy>=1.13",
  "pillow>=11",
  "pyproj>=3.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
