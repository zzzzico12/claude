<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>森の変化ウォッチ</title>
    <meta name="description" content="Sentinel-2 の衛星画像の植物の量（NDVI）の変化から、アマゾンの森が減った場所を見つけ、理由の候補を AI が説明します" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site">
      <h1>森の変化ウォッチ</h1>
      <p class="lead" id="lead"></p>
    </header>
    <main>
      <section class="stats" id="stats"></section>
      <div class="layout">
        <div class="mapcol">
          <div class="controls">
            <label class="slider">
              <span id="label-before"></span>
              <input type="range" id="fade" min="0" max="100" value="100" aria-label="前の年と後の年の画像を切り替える" />
              <span id="label-after"></span>
            </label>
            <label><input type="checkbox" id="show-change" checked /> 検知した変化（赤）</label>
          </div>
          <div id="map" role="img" aria-label="衛星画像の地図。赤い所が森が減ったと検知した場所"></div>
          <p class="hint">スライダーで前の年と後の年の画像を見比べられます。丸を押すと、その場所の説明が出ます（丸の大きさは面積）。</p>
        </div>
        <aside class="side" id="detail"></aside>
      </div>
      <h2>変化の大きい場所</h2>
      <div class="table-wrap"><table id="list"><thead><tr><th>#</th><th>面積</th><th>NDVI</th><th>理由の候補（AI）</th></tr></thead><tbody></tbody></table></div>
      <details class="method">
        <summary>計算のしかたと、どれくらい当たったか</summary>
        <div id="method"></div>
      </details>
    </main>
    <div id="attribution"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
